<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Очередь эпизодов — продвинутая</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            padding: 2rem 2rem 2.5rem;
        }
        
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        
        .app-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a1a2e;
            letter-spacing: -0.3px;
        }
        
        .app-header .status-group {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            font-size: 0.85rem;
            color: #6b7280;
        }
        
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            background: #d1d5db;
            transition: 0.3s;
        }
        
        .status-dot.online {
            background: #10b981;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
        }
        
        .status-dot.offline {
            background: #ef4444;
        }
        
        .status-text {
            font-weight: 500;
        }
        
        .counter-badge {
            background: #f3f4f6;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #374151;
        }
        
        .episode-selector {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .episode-selector label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .episode-selector select {
            flex: 1;
            min-width: 200px;
            padding: 0.6rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            background: #fafbfc;
            color: #1a1a2e;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .episode-selector select:focus {
            border-color: #4f46e5;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.08);
        }
        
        .episode-selector .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            border: none;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            white-space: nowrap;
        }
        
        .episode-selector .btn-primary {
            background: #4f46e5;
            color: #ffffff;
        }
        
        .episode-selector .btn-primary:hover {
            background: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }
        
        .episode-selector .btn-danger {
            background: #fee2e2;
            color: #dc2626;
        }
        
        .episode-selector .btn-danger:hover {
            background: #fecaca;
        }
        
        .episode-block {
            background: #fafbfc;
            border-radius: 16px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #e5e7eb;
        }
        
        .episode-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #9ca3af;
            margin-bottom: 0.3rem;
        }
        
        .episode-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1a1a2e;
            background: transparent;
            border: none;
            width: 100%;
            padding: 0.3rem 0;
            outline: none;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
            font-family: inherit;
        }
        
        .episode-title:focus {
            border-bottom-color: #4f46e5;
        }
        
        .episode-meta {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #6b7280;
            background: transparent;
            border: none;
            width: 100%;
            padding: 0.2rem 0;
            outline: none;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
            font-family: inherit;
        }
        
        .episode-meta:focus {
            border-bottom-color: #4f46e5;
        }
        
        .episode-notes {
            margin-top: 0.8rem;
        }
        
        .episode-notes textarea {
            width: 100%;
            padding: 0.6rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 0.9rem;
            outline: none;
            background: #ffffff;
            color: #1a1a2e;
            font-family: inherit;
            resize: vertical;
            min-height: 60px;
            transition: 0.2s;
        }
        
        .episode-notes textarea:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.08);
        }
        
        .episode-notes textarea::placeholder {
            color: #9ca3af;
        }
        
        .episode-notes-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #9ca3af;
            margin-bottom: 0.3rem;
            display: block;
        }
        
        .queue-section {
            margin-top: 0.5rem;
        }
        
        .queue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        .queue-header .title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .queue-header .badge {
            background: #f3f4f6;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #374151;
        }
        
        .add-form {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .add-form input {
            flex: 2;
            min-width: 160px;
            padding: 0.6rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
            background: #fafbfc;
            color: #1a1a2e;
            font-family: inherit;
        }
        
        .add-form input:focus {
            border-color: #4f46e5;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.08);
        }
        
        .add-form .btn-add {
            padding: 0.6rem 1.6rem;
            border-radius: 12px;
            border: none;
            background: #4f46e5;
            color: #ffffff;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            white-space: nowrap;
        }
        
        .add-form .btn-add:hover {
            background: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }
        
        .queue-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .queue-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1rem;
            margin-bottom: 0.4rem;
            border-radius: 12px;
            border: 2px solid transparent;
            transition: 0.2s ease;
            background: #fafbfc;
            flex-wrap: wrap;
        }
        
        .queue-item:hover {
            background: #f3f4f6;
        }
        
        .queue-item.done {
            opacity: 0.6;
            background: #f0fdf4;
            border-color: #86efac;
        }
        
        .queue-item.done .name {
            color: #166534;
        }
        
        .queue-item.skipped {
            opacity: 0.5;
            background: #fef3c7;
            border-color: #fcd34d;
        }
        
        .queue-item.skipped .name {
            color: #92400e;
        }
        
        .queue-item.next {
            border-color: #4f46e5;
            background: #eef2ff;
            box-shadow: 0 2px 12px rgba(79, 70, 229, 0.08);
        }
        
        .queue-item.next .name {
            font-weight: 600;
            color: #4f46e5;
        }
        
        .queue-item .index {
            font-size: 0.7rem;
            font-weight: 500;
            color: #9ca3af;
            min-width: 1.8rem;
            text-align: right;
        }
        
        .queue-item .name {
            flex: 1;
            font-size: 0.95rem;
            color: #1a1a2e;
            word-break: break-word;
            font-weight: 400;
            min-width: 120px;
        }
        
        .queue-item .status-badge {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.15rem 0.6rem;
            border-radius: 40px;
            background: #e5e7eb;
            color: #6b7280;
        }
        
        .queue-item .status-badge.done-badge {
            background: #86efac;
            color: #166534;
        }
        
        .queue-item .status-badge.skip-badge {
            background: #fcd34d;
            color: #92400e;
        }
        
        .queue-item .status-badge.waiting-badge {
            background: #bfdbfe;
            color: #1e40af;
        }
        
        .queue-item .actions {
            display: flex;
            gap: 0.3rem;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .queue-item .btn-action {
            padding: 0.2rem 0.6rem;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            background: #ffffff;
            color: #374151;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
            white-space: nowrap;
        }
        
        .queue-item .btn-action:hover {
            background: #f3f4f6;
            transform: translateY(-1px);
        }
        
        .queue-item .btn-action.dice-btn {
            border-color: #6366f1;
            color: #4f46e5;
            background: #eef2ff;
        }
        
        .queue-item .btn-action.dice-btn:hover {
            background: #c7d2fe;
        }
        
        .queue-item .btn-action.dice-btn.active {
            background: #4f46e5;
            color: #ffffff;
            border-color: #4f46e5;
        }
        
        .queue-item .btn-action.skip-btn {
            border-color: #f59e0b;
            color: #d97706;
            background: #fef3c7;
        }
        
        .queue-item .btn-action.skip-btn:hover {
            background: #fde68a;
        }
        
        .queue-item .btn-action.skip-btn.active {
            background: #d97706;
            color: #ffffff;
            border-color: #d97706;
        }
        
        .queue-item .btn-action.reset-btn {
            border-color: #ef4444;
            color: #ef4444;
            background: #fee2e2;
            font-size: 0.6rem;
        }
        
        .queue-item .btn-action.reset-btn:hover {
            background: #fecaca;
        }
        
        /* ===== НОВЫЕ КНОПКИ ПЕРЕМЕЩЕНИЯ ===== */
        .queue-item .move-btns {
            display: flex;
            flex-direction: column;
            gap: 1px;
            flex-shrink: 0;
        }
        .queue-item .move-btn {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 0.7rem;
            padding: 0 2px;
            transition: 0.2s;
            line-height: 1.2;
            border-radius: 4px;
        }
        .queue-item .move-btn:hover {
            color: #4f46e5;
            background: #eef2ff;
        }
        .queue-item .move-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }
        .queue-item .move-btn:disabled:hover {
            color: #9ca3af;
            background: none;
        }
        /* ===== КОНЕЦ НОВЫХ КНОПОК ===== */
        
        .queue-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            flex-shrink: 0;
            accent-color: #4f46e5;
        }
        
        .queue-item .delete-btn {
            background: none;
            border: none;
            color: #d1d5db;
            font-size: 1rem;
            cursor: pointer;
            padding: 0 0.2rem;
            transition: 0.15s;
            line-height: 1;
        }
        
        .queue-item:hover .delete-btn {
            color: #9ca3af;
        }
        
        .queue-item .delete-btn:hover {
            color: #ef4444;
            transform: scale(1.1);
        }
        
        .finish-area {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .finish-btn {
            background: #f3f4f6;
            border: none;
            color: #9ca3af;
            font-weight: 500;
            padding: 0.7rem 2.4rem;
            border-radius: 60px;
            font-size: 0.9rem;
            cursor: default;
            transition: 0.2s;
            font-family: inherit;
            opacity: 0.6;
            pointer-events: none;
            user-select: none;
        }
        
        .finish-btn.active {
            opacity: 1;
            pointer-events: auto;
            cursor: pointer;
            background: #4f46e5;
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.25);
        }
        
        .finish-btn.active:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.3);
        }
        
        .log-section {
            margin-top: 2rem;
            border-top: 2px solid #f0f2f5;
            padding-top: 1.5rem;
        }
        
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        .log-header .title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .log-header .btn-clear-log {
            background: #fee2e2;
            border: none;
            color: #dc2626;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        
        .log-header .btn-clear-log:hover {
            background: #fecaca;
        }
        
        .log-container {
            background: #fafbfc;
            border-radius: 12px;
            padding: 1rem;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
        }
        
        .log-container::-webkit-scrollbar {
            width: 6px;
        }
        
        .log-container::-webkit-scrollbar-track {
            background: #f0f2f5;
            border-radius: 10px;
        }
        
        .log-container::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }
        
        .log-entry {
            padding: 0.4rem 0.5rem;
            border-bottom: 1px solid #f0f2f5;
            font-size: 0.85rem;
            color: #374151;
            display: flex;
            gap: 0.5rem;
            align-items: baseline;
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .log-entry .log-time {
            color: #9ca3af;
            font-size: 0.7rem;
            font-weight: 500;
            min-width: 65px;
        }
        
        .log-entry .log-type {
            font-weight: 600;
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            text-transform: uppercase;
        }
        
        .log-entry .log-type.done {
            background: #86efac;
            color: #166534;
        }
        
        .log-entry .log-type.skip {
            background: #fcd34d;
            color: #92400e;
        }
        
        .log-entry .log-type.dice {
            background: #c7d2fe;
            color: #3730a3;
        }
        
        .log-entry .log-type.round {
            background: #d1d5db;
            color: #374151;
        }
        
        .log-entry .log-type.info {
            background: #bfdbfe;
            color: #1e40af;
        }
        
        .log-entry .log-text {
            flex: 1;
        }
        
        .empty-msg {
            color: #9ca3af;
            font-style: italic;
            padding: 1rem 0.5rem;
            font-weight: 400;
            font-size: 0.9rem;
        }
        
        .init-area {
            text-align: center;
            padding: 3rem 1rem;
            background: #fafbfc;
            border-radius: 16px;
            border: 2px dashed #e5e7eb;
        }
        
        .init-area h2 {
            font-weight: 500;
            color: #1a1a2e;
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }
        
        .init-area p {
            color: #6b7280;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
        
        .init-btn {
            background: #4f46e5;
            border: none;
            color: #ffffff;
            padding: 0.8rem 2.5rem;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.2);
        }
        
        .init-btn:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(79, 70, 229, 0.3);
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9998;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }
        
        .modal-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        
        .modal-content {
            background: #ffffff;
            border-radius: 20px;
            padding: 2rem;
            max-width: 480px;
            width: 90%;
            color: #1a1a2e;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }
        
        .modal-content h2 {
            font-weight: 600;
            margin-bottom: 1.5rem;
            font-size: 1.2rem;
            color: #1a1a2e;
        }
        
        .modal-content input {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            background: #fafbfc;
            color: #1a1a2e;
            font-family: inherit;
            margin-bottom: 1rem;
            transition: 0.2s;
        }
        
        .modal-content input:focus {
            border-color: #4f46e5;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.08);
        }
        
        .modal-content .modal-buttons {
            display: flex;
            gap: 0.6rem;
            justify-content: flex-end;
        }
        
        .modal-content .modal-buttons button {
            padding: 0.6rem 1.6rem;
            border-radius: 12px;
            border: 2px solid #e5e7eb;
            background: transparent;
            color: #374151;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            font-weight: 500;
        }
        
        .modal-content .modal-buttons button:hover {
            background: #f3f4f6;
        }
        
        .modal-content .modal-buttons .confirm-btn {
            background: #4f46e5;
            border-color: #4f46e5;
            color: #ffffff;
        }
        
        .modal-content .modal-buttons .confirm-btn:hover {
            background: #4338ca;
            border-color: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-size: 1rem;
            color: #1a1a2e;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }
        
        .loading-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        
        .loading-spinner {
            border: 3px solid #e5e7eb;
            border-top: 3px solid #4f46e5;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
            margin-right: 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 640px) {
            body {
                padding: 1rem 0.5rem;
            }
            
            .container {
                padding: 1.5rem 1rem;
                border-radius: 16px;
            }
            
            .app-header h1 {
                font-size: 1.2rem;
            }
            
            .app-header .status-group {
                font-size: 0.75rem;
                gap: 0.8rem;
            }
            
            .episode-block {
                padding: 1rem;
            }
            
            .episode-title {
                font-size: 1.1rem;
            }

        function saveToFirebase() {
            if (!fullData) return;
            database.ref(STATE_KEY).set(fullData).catch((error) => {
                console.error('Ошибка сохранения:', error);
            });
        }

        function loadFromFirebase() {
            database.ref(STATE_KEY).once('value').then((snapshot) => {
                const val = snapshot.val();
                if (val) {
                    fullData = val;
                    // Миграция: добавляем поля, если их нет
                    const episodes = fullData.episodes || {};
                    Object.keys(episodes).forEach(key => {
                        const ep = episodes[key];
                        if (!ep.notes) ep.notes = '';
                        if (!ep.log) ep.log = [];
                        if (ep.players) {
                            ep.players.forEach(p => {
                                if (p.skipped === undefined) p.skipped = false;
                                if (p.diceUsed === undefined) p.diceUsed = 0;
                                if (p.maxDice === undefined) p.maxDice = 2;
                            });
                        }
                    });
                    if (!fullData.currentEpisode) {
                        const keys = Object.keys(fullData.episodes);
                        fullData.currentEpisode = keys.length > 0 ? keys[0] : null;
                    }
                    showContent(true);
                    renderAll();
                } else {
                    showContent(false);
                }
                loadingOverlay.classList.remove('visible');
            }).catch((error) => {
                console.error('Ошибка загрузки:', error);
                loadingOverlay.classList.remove('visible');
                showContent(false);
            });
        }

        function showContent(hasData) {
            if (hasData) {
                initArea.style.display = 'none';
                contentArea.style.display = 'block';
            } else {
                initArea.style.display = 'block';
                contentArea.style.display = 'none';
                episodeSelect.innerHTML = '<option value="">— Нет данных —</option>';
            }
        }

        function renderEpisodeSelect() {
            if (!fullData) return;
            const current = fullData.currentEpisode;
            const keys = Object.keys(fullData.episodes);
            
            episodeSelect.innerHTML = '';
            if (keys.length === 0) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = '— Нет эпизодов —';
                episodeSelect.appendChild(opt);
                return;
            }

            keys.forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                const ep = fullData.episodes[key];
                opt.textContent = ep.title || key;
                if (key === current) opt.selected = true;
                episodeSelect.appendChild(opt);
            });

            if (current && keys.includes(current)) {
                episodeSelect.value = current;
            } else if (keys.length > 0) {
                episodeSelect.value = keys[0];
                fullData.currentEpisode = keys[0];
            }
        }

        function getCurrentEpisode() {
            if (!fullData) return null;
            const id = episodeSelect.value;
            if (!id || !fullData.episodes[id]) return null;
            return { id, data: fullData.episodes[id] };
        }

        function addLogEntry(epData, type, text) {
            if (!epData.log) epData.log = [];
            const time = new Date().toLocaleString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
            epData.log.push({
                time: time,
                type: type,
                text: text,
                timestamp: Date.now()
            });
            if (epData.log.length > 100) {
                epData.log = epData.log.slice(-100);
            }
            saveToFirebase();
        }

        function renderLog(epData) {
            logContainer.innerHTML = '';
            if (!epData.log || epData.log.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-msg';
                empty.textContent = 'Лог пуст';
                logContainer.appendChild(empty);
                return;
            }
            
            const entries = [...epData.log].reverse();
            entries.forEach(entry => {
                const div = document.createElement('div');
                div.className = 'log-entry';
                
                const timeSpan = document.createElement('span');
                timeSpan.className = 'log-time';
                timeSpan.textContent = entry.time;
                div.appendChild(timeSpan);
                
                const typeSpan = document.createElement('span');
                typeSpan.className = `log-type ${entry.type}`;
                const typeLabels = {
                    'done': '✅',
                    'skip': '⏭️',
                    'dice': '🎲',
                    'round': '🔄',
                    'info': 'ℹ️'
                };
                typeSpan.textContent = typeLabels[entry.type] || entry.type;
                div.appendChild(typeSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'log-text';
                textSpan.textContent = entry.text;
                div.appendChild(textSpan);
                
                logContainer.appendChild(div);
            });
        }

        function renderAll() {
            if (!fullData) return;
            
            renderEpisodeSelect();
            const ep = getCurrentEpisode();
            
            if (!ep) {
                episodeTitleEl.value = '';
                episodeMetaEl.value = '';
                episodeNotesEl.value = '';
                queueList.innerHTML = '<li class="empty-msg">Нет эпизодов. Создайте новый.</li>';
                counterDisplay.textContent = '0 участников';
                doneBadge.textContent = '0 / 0';
                finishBtn.classList.remove('active');
                finishBtn.textContent = 'Завершить круг';
                logContainer.innerHTML = '<div class="empty-msg">Лог пуст</div>';
                return;
            }

            const data = ep.data;
            episodeTitleEl.value = data.title || '';
            episodeMetaEl.value = data.meta || '';
            episodeNotesEl.value = data.notes || '';

            const players = data.players || [];
            const total = players.length;
            const doneCount = players.filter(p => p.done).length;
            const skippedCount = players.filter(p => p.skipped).length;
            const allDoneOrSkipped = total > 0 && (doneCount + skippedCount) === total;

            counterDisplay.textContent = `${total} участников`;
            doneBadge.textContent = `${doneCount} / ${total}`;

            let nextIndex = -1;
            for (let i = 0; i < total; i++) {
                if (!players[i].done && !players[i].skipped) {
                    nextIndex = i;
                    break;
                }
            }

            queueList.innerHTML = '';
            if (total === 0) {
                const empty = document.createElement('li');
                empty.className = 'empty-msg';
                empty.textContent = 'Очередь пуста. Добавьте участников.';
                queueList.appendChild(empty);
            } else {
                players.forEach((p, idx) => {
                    const li = document.createElement('li');
                    li.className = 'queue-item';

                    if (p.done) {
                        li.classList.add('done');
                    } else if (p.skipped) {
                        li.classList.add('skipped');
                    } else if (idx === nextIndex) {
                        li.classList.add('next');
                    }

                    const indexSpan = document.createElement('span');
                    indexSpan.className = 'index';
                    indexSpan.textContent = `#${idx + 1}`;
                    li.appendChild(indexSpan);

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'name';
                    nameSpan.textContent = p.name || '?';
                    li.appendChild(nameSpan);

                    const statusBadge = document.createElement('span');
                    statusBadge.className = 'status-badge';
                    if (p.done) {
                        statusBadge.className += ' done-badge';
                        statusBadge.textContent = '✓ Отписался';
                    } else if (p.skipped) {
                        statusBadge.className += ' skip-badge';
                        statusBadge.textContent = '⏭ Пропуск';
                    } else if (idx === nextIndex) {
                        statusBadge.className += ' waiting-badge';
                        statusBadge.textContent = '⏳ Очередь';
                    } else {
                        statusBadge.textContent = '⏳ Ожидание';
                    }
                    li.appendChild(statusBadge);

                    const actionsDiv = document.createElement('div');
                    actionsDiv.className = 'actions';

                    // ===== НОВЫЕ КНОПКИ ПЕРЕМЕЩЕНИЯ =====
                    const moveDiv = document.createElement('div');
                    moveDiv.className = 'move-btns';
                    
                    const upBtn = document.createElement('button');
                    upBtn.className = 'move-btn';
                    upBtn.textContent = '↑';
                    upBtn.disabled = idx === 0;
                    upBtn.dataset.idx = idx;
                    upBtn.dataset.dir = 'up';
                    upBtn.title = 'Поднять выше';
                    moveDiv.appendChild(upBtn);
                    
                    const downBtn = document.createElement('button');
                    downBtn.className = 'move-btn';
                    downBtn.textContent = '↓';
                    downBtn.disabled = idx === total - 1;
                    downBtn.dataset.idx = idx;
                    downBtn.dataset.dir = 'down';
                    downBtn.title = 'Опустить ниже';
                    moveDiv.appendChild(downBtn);
                    
                    actionsDiv.appendChild(moveDiv);
                    // ===== КОНЕЦ НОВЫХ КНОПОК =====

                    if (!p.done && !p.skipped) {
                        const doneBtn = document.createElement('button');
                        doneBtn.className = 'btn-action';
                        doneBtn.textContent = '✅ Отписаться';
                        doneBtn.style.borderColor = '#22c55e';
                        doneBtn.style.color = '#16a34a';
                        doneBtn.style.background = '#dcfce7';
                        doneBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            p.done = true;
                            p.skipped = false;
                            addLogEntry(data, 'done', `${p.name} отписался`);
                            saveToFirebase();
                            renderAll();
                        });
                        actionsDiv.appendChild(doneBtn);
                    }

                    if (!p.done) {
                        const skipBtn = document.createElement('button');
                        skipBtn.className = 'btn-action skip-btn';
                        skipBtn.textContent = p.skipped ? '⏭ Пропущен' : '⏭ Пропустить';
                        if (p.skipped) {
                            skipBtn.classList.add('active');
                        }
                        skipBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            if (p.skipped) {
                                p.skipped = false;
                                addLogEntry(data, 'info', `${p.name} — пропуск отменён`);
                            } else {
                                p.skipped = true;
                                p.done = false;
                                addLogEntry(data, 'skip', `${p.name} пропустил ход`);
                            }
                            saveToFirebase();
                            renderAll();
                        });
                        actionsDiv.appendChild(skipBtn);
                    }

                    if (!p.done) {
                        const diceBtn = document.createElement('button');
                        diceBtn.className = 'btn-action dice-btn';
                        const remaining = p.maxDice - p.diceUsed;
                        diceBtn.textContent = `🎲 ${remaining > 0 ? `Переброс (${remaining})` : 'Нет перебросов'}`;
                        if (remaining <= 0) {
                            diceBtn.style.opacity = '0.4';
                            diceBtn.style.cursor = 'not-allowed';
                        }
                        diceBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            if (p.diceUsed >= p.maxDice) {
                                alert(`У ${p.name} больше нет перебросов!`);
                                return;
                            }
                            p.diceUsed += 1;
                            addLogEntry(data, 'dice', `${p.name} использовал переброс (${p.diceUsed}/${p.maxDice})`);
                            saveToFirebase();
                            renderAll();
                        });
                        actionsDiv.appendChild(diceBtn);
                    }

                    if (p.done || p.skipped) {
                        const resetBtn = document.createElement('button');
                        resetBtn.className = 'btn-action reset-btn';
                        resetBtn.textContent = '↺ Сброс';
                        resetBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            if (confirm(`Сбросить статус "${p.name}"?`)) {
                                p.done = false;
                                p.skipped = false;
                                addLogEntry(data, 'info', `${p.name} — статус сброшен`);
                                saveToFirebase();
                                renderAll();
                            }
                        });
                        actionsDiv.appendChild(resetBtn);
                    }

                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-btn';
                    delBtn.textContent = '✕';
                    delBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        if (confirm(`Удалить "${p.name}"?`)) {
                            data.players.splice(idx, 1);
                            addLogEntry(data, 'info', `${p.name} удалён из очереди`);
                            saveToFirebase();
                            renderAll();
                        }
                    });
                    actionsDiv.appendChild(delBtn);

                    li.appendChild(actionsDiv);
                    queueList.appendChild(li);
                });
            }

            if (total > 0 && allDoneOrSkipped) {
                finishBtn.classList.add('active');
                finishBtn.textContent = '🔄 Завершить круг';
            } else {
                finishBtn.classList.remove('active');
                if (total === 0) {
                    finishBtn.textContent = 'Нет участников';
                } else {
                    const remaining = total - doneCount - skippedCount;
                    finishBtn.textContent = `${remaining} осталось`;
                }
            }

            renderLog(data);
        }

        // ===== ОБРАБОТЧИК КНОПОК ПЕРЕМЕЩЕНИЯ (делегирование) =====
        queueList.addEventListener('click', function(e) {
            const moveBtn = e.target.closest('.move-btn');
            if (!moveBtn) return;
            
            const idx = parseInt(moveBtn.dataset.idx);
            const dir = moveBtn.dataset.dir;
            const ep = getCurrentEpisode();
            if (!ep) return;
            
            const players = ep.data.players;
            if (dir === 'up' && idx > 0) {
                [players[idx], players[idx - 1]] = [players[idx - 1], players[idx]];
            } else if (dir === 'down' && idx < players.length - 1) {
                [players[idx], players[idx + 1]] = [players[idx + 1], players[idx]];
            } else {
                return;
            }
            
            addLogEntry(ep.data, 'info', `Порядок изменён: ${players.map(p => p.name).join(' → ')}`);
            saveToFirebase();
            renderAll();
        });
        // ===== КОНЕЦ ОБРАБОТЧИКА =====

        function initDefaultData() {
            fullData = getDefaultData();
            saveToFirebase();
            showContent(true);
            renderAll();
        }

        initBtn.addEventListener('click', initDefaultData);

        episodeTitleEl.addEventListener('input', function() {
            if (!fullData) return;
            const id = episodeSelect.value;
            if (id && fullData.episodes[id]) {
                fullData.episodes[id].title = episodeTitleEl.value;
                saveToFirebase();
                renderEpisodeSelect();
            }
        });

        episodeMetaEl.addEventListener('input', function() {
            if (!fullData) return;
            const id = episodeSelect.value;
            if (id && fullData.episodes[id]) {
                fullData.episodes[id].meta = episodeMetaEl.value;
                saveToFirebase();
            }
        });

        episodeNotesEl.addEventListener('input', function() {
            if (!fullData) return;
            const id = episodeSelect.value;
            if (id && fullData.episodes[id]) {
                fullData.episodes[id].notes = episodeNotesEl.value;
                saveToFirebase();
            }
        });

        episodeSelect.addEventListener('change', function() {
            if (!fullData) return;
            fullData.currentEpisode = episodeSelect.value;
            saveToFirebase();
            renderAll();
        });

        function addPlayer() {
            const raw = newNameInput.value.trim();
            if (!raw) {
                alert('Введите имя персонажа.');
                return;
            }
            const ep = getCurrentEpisode();
            if (!ep) {
                alert('Нет активного эпизода.');
                return;
            }
            ep.data.players.push({ 
                name: raw, 
                done: false, 
                skipped: false, 
                diceUsed: 0, 
                maxDice: 2 
            });
            addLogEntry(ep.data, 'info', `${raw} добавлен в очередь`);
            saveToFirebase();
            renderAll();
            newNameInput.value = '';
            newNameInput.focus();
        }

        addBtn.addEventListener('click', addPlayer);
        newNameInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addPlayer();
            }
        });

        finishBtn.addEventListener('click', function() {
            const ep = getCurrentEpisode();
            if (!ep) return;
            const players = ep.data.players;
            const total = players.length;
            if (total === 0) return;
            
            const doneCount = players.filter(p => p.done).length;
            const skippedCount = players.filter(p => p.skipped).length;
            
            if ((doneCount + skippedCount) !== total) {
                alert('Не все отписались или пропустили ход!');
                return;
            }
            
            const doneList = players.filter(p => p.done).map(p => p.name).join(', ');
            const skippedList = players.filter(p => p.skipped).map(p => p.name).join(', ');
            let logText = 'Круг завершён';
            if (doneList) logText += ` | Отписались: ${doneList}`;
            if (skippedList) logText += ` | Пропустили: ${skippedList}`;
            addLogEntry(ep.data, 'round', logText);
            
            for (let p of players) {
                p.done = false;
                p.skipped = false;
            }
            saveToFirebase();
            renderAll();
        });

        clearLogBtn.addEventListener('click', function() {
            const ep = getCurrentEpisode();
            if (!ep) return;
            if (confirm('Очистить весь лог для этого эпизода?')) {
                ep.data.log = [];
                saveToFirebase();
                renderAll();
            }
        });

        function openModal() {
            newEpisodeTitle.value = '';
            newEpisodeMeta.value = '';
            modalOverlay.classList.add('visible');
            setTimeout(() => newEpisodeTitle.focus(), 100);
        }

        function closeModal() {
            modalOverlay.classList.remove('visible');
        }

        function createEpisode() {
            const title = newEpisodeTitle.value.trim() || 'Новый эпизод';
            const meta = newEpisodeMeta.value.trim() || '';
            const id = 'ep' + Date.now();
            fullData.episodes[id] = {
                title: title,
                meta: meta,
                notes: '',
                players: [],
                log: []
            };
            fullData.currentEpisode = id;
            saveToFirebase();
            renderAll();
            closeModal();
        }

        addEpBtn.addEventListener('click', openModal);
        modalCancel.addEventListener('click', closeModal);
        modalConfirm.addEventListener('click', createEpisode);
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) closeModal();
        });
        newEpisodeTitle.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                newEpisodeMeta.focus();
            }
        });
        newEpisodeMeta.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                createEpisode();
            }
        });

        deleteEpBtn.addEventListener('click', function() {
            if (!fullData) return;
            const id = episodeSelect.value;
            if (!id || !fullData.episodes[id]) return;
            if (!confirm(`Удалить эпизод "${fullData.episodes[id].title}"?`)) return;
            
            delete fullData.episodes[id];
            const keys = Object.keys(fullData.episodes);
            if (keys.length > 0) {
                fullData.currentEpisode = keys[0];
            } else {
                fullData.currentEpisode = null;
            }
            saveToFirebase();
            renderAll();
        });

        loadFromFirebase();
    })();
</script>

</body>
</html>
