<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Очередь эпизодов</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        
        .container {
            max-width: 820px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            padding: 2rem 2rem 2.5rem;
        }
        
        /* --- Заголовок --- */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        
        .app-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a1a2e;
            letter-spacing: -0.3px;
        }
        
        .app-header .status-group {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            font-size: 0.85rem;
            color: #6b7280;
        }
        
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            background: #d1d5db;
            transition: 0.3s;
        }
        
        .status-dot.online {
            background: #10b981;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
        }
        
        .status-dot.offline {
            background: #ef4444;
        }
        
        .status-text {
            font-weight: 500;
        }
        
        .counter-badge {
            background: #f3f4f6;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #374151;
        }
        
        /* --- Выбор эпизода --- */
        .episode-selector {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .episode-selector label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .episode-selector select {
            flex: 1;
            min-width: 200px;
            padding: 0.6rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            background: #fafbfc;
            color: #1a1a2e;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .episode-selector select:focus {
            border-color: #4f46e5;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.08);
        }
        
        .episode-selector select option {
            background: #ffffff;
            color: #1a1a2e;
        }
        
        .episode-selector .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            border: none;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            white-space: nowrap;
        }
        
        .episode-selector .btn-primary {
            background: #4f46e5;
            color: #ffffff;
        }
        
        .episode-selector .btn-primary:hover {
            background: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }
        
        .episode-selector .btn-danger {
            background: #fee2e2;
            color: #dc2626;
        }
        
        .episode-selector .btn-danger:hover {
            background: #fecaca;
        }
        
        /* --- Блок эпизода --- */
        .episode-block {
            background: #fafbfc;
            border-radius: 16px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid #e5e7eb;
        }
        
        .episode-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #9ca3af;
            margin-bottom: 0.3rem;
        }
        
        .episode-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1a1a2e;
            background: transparent;
            border: none;
            width: 100%;
            padding: 0.3rem 0;
            outline: none;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
            font-family: inherit;
        }
        
        .episode-title:focus {
            border-bottom-color: #4f46e5;
        }
        
        .episode-title::placeholder {
            color: #d1d5db;
        }
        
        .episode-meta {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #6b7280;
            background: transparent;
            border: none;
            width: 100%;
            padding: 0.2rem 0;
            outline: none;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
            font-family: inherit;
        }
        
        .episode-meta:focus {
            border-bottom-color: #4f46e5;
        }
        
        .episode-meta::placeholder {
            color: #d1d5db;
        }
        
        /* --- Секция очереди --- */
        .queue-section {
            margin-top: 0.5rem;
        }
        
        .queue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        .queue-header .title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .queue-header .badge {
            background: #f3f4f6;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #374151;
        }
        
        /* --- Форма добавления --- */
        .add-form {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .add-form input {
            flex: 2;
            min-width: 160px;
            padding: 0.6rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
            background: #fafbfc;
            color: #1a1a2e;
            font-family: inherit;
        }
        
        .add-form input:focus {
            border-color: #4f46e5;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.08);
        }
        
        .add-form input::placeholder {
            color: #9ca3af;
        }
        
        .add-form .btn-add {
            padding: 0.6rem 1.6rem;
            border-radius: 12px;
            border: none;
            background: #4f46e5;
            color: #ffffff;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            white-space: nowrap;
        }
        
        .add-form .btn-add:hover {
            background: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }
        
        /* --- Список --- */
        .queue-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .queue-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 1rem;
            margin-bottom: 0.4rem;
            border-radius: 12px;
            border: 2px solid transparent;
            transition: 0.2s ease;
            background: #fafbfc;
        }
        
        .queue-item:hover {
            background: #f3f4f6;
        }
        
        .queue-item.done {
            opacity: 0.5;
            background: #f9fafb;
        }
        
        .queue-item.done .name {
            text-decoration: line-through;
            color: #9ca3af;
        }
        
        .queue-item.next {
            border-color: #4f46e5;
            background: #eef2ff;
            box-shadow: 0 2px 12px rgba(79, 70, 229, 0.08);
        }
        
        .queue-item.next .name {
            font-weight: 600;
            color: #4f46e5;
        }
        
        .queue-item .index {
            font-size: 0.7rem;
            font-weight: 500;
            color: #9ca3af;
            min-width: 1.8rem;
            text-align: right;
        }
        
        .queue-item .name {
            flex: 1;
            font-size: 0.95rem;
            color: #1a1a2e;
            word-break: break-word;
            font-weight: 400;
        }
        
        .queue-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            flex-shrink: 0;
            accent-color: #4f46e5;
            opacity: 1 !important;
            visibility: visible !important;
            display: inline-block !important;
            appearance: auto;
            -webkit-appearance: checkbox;
            -moz-appearance: checkbox;
            border: 2px solid #d1d5db;
            border-radius: 4px;
        }
        
        .queue-item input[type="checkbox"]:checked {
            accent-color: #4f46e5;
            border-color: #4f46e5;
        }
        
        .queue-item .delete-btn {
            background: none;
            border: none;
            color: #d1d5db;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0 0.2rem;
            transition: 0.15s;
            line-height: 1;
        }
        
        .queue-item:hover .delete-btn {
            color: #9ca3af;
        }
        
        .queue-item .delete-btn:hover {
            color: #ef4444;
            transform: scale(1.1);
        }
        
        /* --- Кнопка завершения --- */
        .finish-area {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
        }
        
        .finish-btn {
            background: #f3f4f6;
            border: none;
            color: #9ca3af;
            font-weight: 500;
            padding: 0.7rem 2.4rem;
            border-radius: 60px;
            font-size: 0.9rem;
            cursor: default;
            transition: 0.2s;
            font-family: inherit;
            opacity: 0.6;
            pointer-events: none;
            user-select: none;
        }
        
        .finish-btn.active {
            opacity: 1;
            pointer-events: auto;
            cursor: pointer;
            background: #4f46e5;
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.25);
        }
        
        .finish-btn.active:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.3);
        }
        
        /* --- Пустое состояние --- */
        .empty-msg {
            color: #9ca3af;
            font-style: italic;
            padding: 1rem 0.5rem;
            font-weight: 400;
            font-size: 0.9rem;
        }
        
        /* --- Инициализация --- */
        .init-area {
            text-align: center;
            padding: 3rem 1rem;
            background: #fafbfc;
            border-radius: 16px;
            border: 2px dashed #e5e7eb;
        }
        
        .init-area h2 {
            font-weight: 500;
            color: #1a1a2e;
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }
        
        .init-area p {
            color: #6b7280;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
        
        .init-btn {
            background: #4f46e5;
            border: none;
            color: #ffffff;
            padding: 0.8rem 2.5rem;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.2);
        }
        
        .init-btn:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(79, 70, 229, 0.3);
        }
        
        /* --- Модальное окно --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9998;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }
        
        .modal-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        
        .modal-content {
            background: #ffffff;
            border-radius: 20px;
            padding: 2rem;
            max-width: 480px;
            width: 90%;
            color: #1a1a2e;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }
        
        .modal-content h2 {
            font-weight: 600;
            margin-bottom: 1.5rem;
            font-size: 1.2rem;
            color: #1a1a2e;
        }
        
        .modal-content input {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            background: #fafbfc;
            color: #1a1a2e;
            font-family: inherit;
            margin-bottom: 1rem;
            transition: 0.2s;
        }
        
        .modal-content input:focus {
            border-color: #4f46e5;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.08);
        }
        
        .modal-content .modal-buttons {
            display: flex;
            gap: 0.6rem;
            justify-content: flex-end;
        }
        
        .modal-content .modal-buttons button {
            padding: 0.6rem 1.6rem;
            border-radius: 12px;
            border: 2px solid #e5e7eb;
            background: transparent;
            color: #374151;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            font-weight: 500;
        }
        
        .modal-content .modal-buttons button:hover {
            background: #f3f4f6;
        }
        
        .modal-content .modal-buttons .confirm-btn {
            background: #4f46e5;
            border-color: #4f46e5;
            color: #ffffff;
        }
        
        .modal-content .modal-buttons .confirm-btn:hover {
            background: #4338ca;
            border-color: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }
        
        /* --- Загрузка --- */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-size: 1rem;
            color: #1a1a2e;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }
        
        .loading-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        
        .loading-spinner {
            border: 3px solid #e5e7eb;
            border-top: 3px solid #4f46e5;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
            margin-right: 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* --- Адаптив --- */
        @media (max-width: 640px) {
            body {
                padding: 1rem 0.5rem;
            }
            
            .container {
                padding: 1.5rem 1rem;
                border-radius: 16px;
            }
            
            .app-header h1 {
                font-size: 1.2rem;
            }
            
            .app-header .status-group {
                font-size: 0.75rem;
                gap: 0.8rem;
            }
            
            .episode-block {
                padding: 1rem;
            }
            
            .episode-title {
                font-size: 1.1rem;
            }
            
            .queue-item {
                flex-wrap: wrap;
                gap: 0.4rem;
                padding: 0.6rem 0.8rem;
            }
            
            .queue-item .name {
                min-width: 80px;
                font-size: 0.9rem;
            }
            
            .add-form input {
                min-width: 120px;
                font-size: 0.85rem;
            }
            
            .add-form .btn-add {
                font-size: 0.85rem;
                padding: 0.5rem 1.2rem;
            }
            
            .episode-selector select {
                min-width: 130px;
                font-size: 0.85rem;
            }
            
            .episode-selector .btn {
                font-size: 0.8rem;
                padding: 0.5rem 0.8rem;
            }
            
            .modal-content {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

<div class="loading-overlay visible" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <span id="loadingText">Подключение к Firebase...</span>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
        <h2>Новый эпизод</h2>
        <input type="text" id="newEpisodeTitle" placeholder="Название эпизода..." />
        <input type="text" id="newEpisodeMeta" placeholder="Доп. информация..." />
        <div class="modal-buttons">
            <button id="modalCancel">Отмена</button>
            <button class="confirm-btn" id="modalConfirm">Создать</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="app-header">
        <h1>🎭 Очередь</h1>
        <div class="status-group">
            <span>
                <span class="status-dot offline" id="statusDot"></span>
                <span class="status-text" id="statusText">Offline</span>
            </span>
            <span class="counter-badge" id="counterDisplay">0 участников</span>
        </div>
    </div>

    <div class="episode-selector">
        <label for="episodeSelect">Эпизод:</label>
        <select id="episodeSelect"></select>
        <button class="btn btn-primary" id="addEpBtn">➕ Новый</button>
        <button class="btn btn-danger" id="deleteEpBtn">🗑 Удалить</button>
    </div>

    <div id="mainContent">
        <div class="init-area" id="initArea">
            <h2>📂 Нет данных</h2>
            <p>Нажмите кнопку, чтобы загрузить 8 эпизодов с очередями</p>
            <button class="init-btn" id="initBtn">Загрузить начальные эпизоды</button>
        </div>

        <div id="contentArea" style="display: none;">
            <div class="episode-block">
                <div class="episode-label">Редактировать</div>
                <input class="episode-title" id="episodeTitle" placeholder="Название эпизода..." />
                <input class="episode-meta" id="episodeMeta" placeholder="Дополнительно..." />
            </div>

            <div class="queue-section">
                <div class="queue-header">
                    <span class="title">Очередь</span>
                    <span class="badge" id="doneBadge">0 / 0</span>
                </div>

                <div class="add-form">
                    <input type="text" id="newNameInput" placeholder="Имя персонажа..." />
                    <button class="btn-add" id="addBtn">Добавить</button>
                </div>

                <ul class="queue-list" id="queueList"></ul>
            </div>

            <div class="finish-area">
                <button class="finish-btn" id="finishBtn">Завершить круг</button>
            </div>
        </div>
    </div>
</div>

<script>

                        meta: 'конец 3 месяца 302 З.Э.',

                        players: [

                        meta: 'конец 3 месяца 302 З.Э.',
                        players: [
                            { name: 'DAEMON BLACKFYRE', done: false },

                            { name: 'ROS', done: false },
                            { name: 'AELYX CELTIGAR', done: false }
                        ]
                    }
                }
            };
        }

        function saveToFirebase() {
            if (!fullData) return;
            database.ref(STATE_KEY).set(fullData).catch((error) => {
                console.error('Ошибка сохранения:', error);
            });
        }

        function loadFromFirebase() {
            database.ref(STATE_KEY).once('value').then((snapshot) => {
                const val = snapshot.val();
                if (val) {
                    fullData = val;
                    if (!fullData.episodes) fullData.episodes = {};
                    if (!fullData.currentEpisode) {
                        const keys = Object.keys(fullData.episodes);
                        fullData.currentEpisode = keys.length > 0 ? keys[0] : null;
                    }
                    showContent(true);
                    renderAll();
                } else {
                    showContent(false);
                }
                loadingOverlay.classList.remove('visible');
            }).catch((error) => {
                console.error('Ошибка загрузки:', error);
                loadingOverlay.classList.remove('visible');
                showContent(false);
            });
        }

        function showContent(hasData) {
            if (hasData) {
                initArea.style.display = 'none';
                contentArea.style.display = 'block';
            } else {
                initArea.style.display = 'block';
                contentArea.style.display = 'none';
                episodeSelect.innerHTML = '<option value="">— Нет данных —</option>';
            }
        }

        function renderEpisodeSelect() {
            if (!fullData) return;
            const current = fullData.currentEpisode;
            const keys = Object.keys(fullData.episodes);
            
            episodeSelect.innerHTML = '';
            if (keys.length === 0) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = '— Нет эпизодов —';
                episodeSelect.appendChild(opt);
                return;
            }

            keys.forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                const ep = fullData.episodes[key];
                opt.textContent = ep.title || key;
                if (key === current) opt.selected = true;
                episodeSelect.appendChild(opt);
            });

            if (current && keys.includes(current)) {
                episodeSelect.value = current;
            } else if (keys.length > 0) {
                episodeSelect.value = keys[0];
                fullData.currentEpisode = keys[0];
            }
        }

        function getCurrentEpisode() {
            if (!fullData) return null;
            const id = episodeSelect.value;
            if (!id || !fullData.episodes[id]) return null;
            return { id, data: fullData.episodes[id] };
        }

        function renderAll() {
            if (!fullData) return;
            
            renderEpisodeSelect();
            const ep = getCurrentEpisode();
            
            if (!ep) {
                episodeTitleEl.value = '';
                episodeMetaEl.value = '';
                queueList.innerHTML = '<li class="empty-msg">Нет эпизодов. Создайте новый.</li>';
                counterDisplay.textContent = '0 участников';
                doneBadge.textContent = '0 / 0';
                finishBtn.classList.remove('active');
                finishBtn.textContent = 'Завершить круг';
                return;
            }

            const data = ep.data;
            episodeTitleEl.value = data.title || '';
            episodeMetaEl.value = data.meta || '';

            const players = data.players || [];
            const total = players.length;
            const doneCount = players.filter(p => p.done).length;
            const allDone = total > 0 && doneCount === total;

            counterDisplay.textContent = `${total} участников`;
            doneBadge.textContent = `${doneCount} / ${total}`;

            let nextIndex = -1;
            for (let i = 0; i < total; i++) {
                if (!players[i].done) {
                    nextIndex = i;
                    break;
                }
            }

            queueList.innerHTML = '';
            if (total === 0) {
                const empty = document.createElement('li');
                empty.className = 'empty-msg';
                empty.textContent = 'Очередь пуста. Добавьте участников.';
                queueList.appendChild(empty);
            } else {
                players.forEach((p, idx) => {
                    const li = document.createElement('li');
                    li.className = 'queue-item';

                    if (p.done) {
                        li.classList.add('done');
                    } else if (idx === nextIndex) {
                        li.classList.add('next');
                    }

                    const indexSpan = document.createElement('span');
                    indexSpan.className = 'index';
                    indexSpan.textContent = `#${idx + 1}`;
                    li.appendChild(indexSpan);

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'name';
                    nameSpan.textContent = p.name || '?';
                    li.appendChild(nameSpan);

                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.checked = p.done;
                    cb.addEventListener('change', function(e) {
                        e.stopPropagation();
                        p.done = cb.checked;
                        saveToFirebase();
                        renderAll();
                    });
                    li.appendChild(cb);

                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-btn';
                    delBtn.textContent = '✕';
                    delBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        if (confirm(`Удалить "${p.name}"?`)) {
                            data.players.splice(idx, 1);
                            saveToFirebase();
                            renderAll();
                        }
                    });
                    li.appendChild(delBtn);

                    queueList.appendChild(li);
                });
            }

            if (total > 0 && allDone) {
                finishBtn.classList.add('active');
                finishBtn.textContent = '🔄 Завершить круг';
            } else {
                finishBtn.classList.remove('active');
                if (total === 0) {
                    finishBtn.textContent = 'Нет участников';
                } else {
                    finishBtn.textContent = `${total - doneCount} осталось`;
                }
            }
        }

        function initDefaultData() {
            fullData = getDefaultData();
            saveToFirebase();
            showContent(true);
            renderAll();
        }

        initBtn.addEventListener('click', initDefaultData);

        episodeTitleEl.addEventListener('input', function() {
            if (!fullData) return;
            const id = episodeSelect.value;
            if (id && fullData.episodes[id]) {
                fullData.episodes[id].title = episodeTitleEl.value;
                saveToFirebase();
                renderEpisodeSelect();
            }
        });

        episodeMetaEl.addEventListener('input', function() {
            if (!fullData) return;
            const id = episodeSelect.value;
            if (id && fullData.episodes[id]) {
                fullData.episodes[id].meta = episodeMetaEl.value;
                saveToFirebase();
            }
        });

        episodeSelect.addEventListener('change', function() {
            if (!fullData) return;
            fullData.currentEpisode = episodeSelect.value;
            saveToFirebase();
            renderAll();
        });

        function addPlayer() {
            const raw = newNameInput.value.trim();
            if (!raw) {
                alert('Введите имя персонажа.');
                return;
            }
            const ep = getCurrentEpisode();
            if (!ep) {
                alert('Нет активного эпизода.');
                return;
            }
            ep.data.players.push({ name: raw, done: false });
            saveToFirebase();
            renderAll();
            newNameInput.value = '';
            newNameInput.focus();
        }

        addBtn.addEventListener('click', addPlayer);
        newNameInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addPlayer();
            }
        });

        finishBtn.addEventListener('click', function() {
            const ep = getCurrentEpisode();
            if (!ep) return;
            const players = ep.data.players;
            const total = players.length;
            if (total === 0) return;
            const doneCount = players.filter(p => p.done).length;
            if (doneCount !== total) {
                alert('Не все отписались!');
                return;
            }
            for (let p of players) {
                p.done = false;
            }
            saveToFirebase();
            renderAll();
        });

        function openModal() {
            newEpisodeTitle.value = '';
            newEpisodeMeta.value = '';
            modalOverlay.classList.add('visible');
            setTimeout(() => newEpisodeTitle.focus(), 100);
        }

        function closeModal() {
            modalOverlay.classList.remove('visible');
        }

        function createEpisode() {
            const title = newEpisodeTitle.value.trim() || 'Новый эпизод';
            const meta = newEpisodeMeta.value.trim() || '';
            const id = 'ep' + Date.now();
            fullData.episodes[id] = {
                title: title,
                meta: meta,
                players: []
            };
            fullData.currentEpisode = id;
            saveToFirebase();
            renderAll();
            closeModal();
        }

        addEpBtn.addEventListener('click', openModal);
        modalCancel.addEventListener('click', closeModal);
        modalConfirm.addEventListener('click', createEpisode);
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) closeModal();
        });
        newEpisodeTitle.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                newEpisodeMeta.focus();
            }
        });
        newEpisodeMeta.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                createEpisode();
            }
        });

        deleteEpBtn.addEventListener('click', function() {
            if (!fullData) return;
            const id = episodeSelect.value;
            if (!id || !fullData.episodes[id]) return;
            if (!confirm(`Удалить эпизод "${fullData.episodes[id].title}"?`)) return;
            
            delete fullData.episodes[id];
            const keys = Object.keys(fullData.episodes);
            if (keys.length > 0) {
                fullData.currentEpisode = keys[0];
            } else {
                fullData.currentEpisode = null;
            }
            saveToFirebase();
            renderAll();
        });

        loadFromFirebase();
    })();
</script>
