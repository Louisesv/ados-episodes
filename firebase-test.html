<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Тест Firebase</title>
    <style>
        body {
            font-family: monospace;
            background: #0d0d1a;
            color: #e0dcd6;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .data-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 16px;
            margin: 10px 0;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 12px;
            max-height: 500px;
            overflow: auto;
        }
        .status {
            padding: 8px 12px;
            border-radius: 4px;
            margin: 4px 0;
        }
        .status.ok { background: rgba(16,185,129,0.15); color: #10b981; }
        .status.err { background: rgba(239,68,68,0.15); color: #ef4444; }
        .status.loading { background: rgba(79,70,229,0.15); color: #818cf8; }
        .status.info { background: rgba(251,191,36,0.15); color: #fbbf24; }
        button {
            background: #4f46e5;
            border: none;
            color: #fff;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 4px;
        }
        button:hover { background: #4338ca; }
        .raw-json {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 4px;
            font-size: 11px;
            overflow: auto;
            max-height: 300px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 4px 8px;
            border: 1px solid rgba(255,255,255,0.06);
            text-align: left;
        }
        th {
            background: rgba(255,255,255,0.03);
            font-weight: 600;
        }
        .done-true { color: #10b981; }
        .done-false { color: #ef4444; }
        .skip-true { color: #fbbf24; }
        .skip-false { color: #6b7280; }
        .current { background: rgba(79,70,229,0.15); }
    </style>
</head>
<body>
    <h1>🔍 Тест Firebase — Детальный</h1>
    <p>Показывает всех игроков и их статусы</p>

    <div id="log">
        <div class="status loading">⏳ Загрузка данных...</div>
    </div>

    <button onclick="loadData()">🔄 Загрузить</button>

    <h3>📋 Все игроки с их статусами:</h3>
    <div class="data-box" id="playersTable">Ожидание загрузки...</div>

    <h3>📋 Сырые данные из Firebase:</h3>
    <div class="data-box" id="rawData">Ожидание загрузки...</div>

    <script>
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyAR3nEI0L71ux5Yro_XM76O1IYKkReXWnE",
            authDomain: "queue-tracker-ff855.firebaseapp.com",
            databaseURL: "https://queue-tracker-ff855-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "queue-tracker-ff855",
            storageBucket: "queue-tracker-ff855.firebasestorage.app",
            messagingSenderId: "545216354720",
            appId: "1:545216354720:web:f57c376b87e3924f232cc5",
            measurementId: "G-D3JQR37F9E"
        };

        const log = document.getElementById('log');
        const rawDataEl = document.getElementById('rawData');
        const playersTableEl = document.getElementById('playersTable');

        function addLog(msg, type) {
            const div = document.createElement('div');
            div.className = 'status ' + (type || 'loading');
            div.textContent = msg;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        window.loadData = function() {
            addLog('🔄 Загрузка данных...', 'loading');
            rawDataEl.textContent = 'Загрузка...';
            playersTableEl.textContent = 'Загрузка...';

            const url = 'https://queue-tracker-ff855-default-rtdb.europe-west1.firebasedatabase.app/queueData.json?t=' + Date.now();

            fetch(url)
                .then(r => r.json())
                .then(data => {
                    if (data) {
                        rawDataEl.textContent = JSON.stringify(data, null, 2);
                        addLog('✅ Данные получены!', 'ok');
                        renderPlayersTable(data);
                    } else {
                        rawDataEl.textContent = '⚠️ Данных нет (null)';
                        addLog('⚠️ Данных нет', 'err');
                    }
                })
                .catch(e => {
                    rawDataEl.textContent = '❌ Ошибка: ' + e.message;
                    addLog('❌ Ошибка: ' + e.message, 'err');
                    console.error(e);
                });
        };

        function renderPlayersTable(data) {
            const episodes = data.episodes || {};
            const keys = Object.keys(episodes).sort(function(a, b) {
                return parseFloat(a.replace('ep', '')) - parseFloat(b.replace('ep', ''));
            });

            if (keys.length === 0) {
                playersTableEl.textContent = '⚠️ Нет эпизодов';
                return;
            }

            let html = '';

            keys.forEach(function(key) {
                const ep = episodes[key];
                if (!ep) return;

                const players = ep.players || [];
                const title = ep.title || 'Без названия';
                const meta = ep.meta || '';

                html += '<h4 style="margin: 12px 0 6px 0; color: #e0dcd6;">' + title + (meta ? ' (' + meta + ')' : '') + '</h4>';

                if (players.length === 0) {
                    html += '<div style="color: #6b7280; padding: 4px;">Нет игроков</div>';
                    return;
                }

                html += '<table>';
                html += '<tr><th>#</th><th>Имя</th><th>Отписался</th><th>Пропустил</th><th>Перебросы</th><th>Статус</th></tr>';

                let currentIndex = -1;
                for (let i = 0; i < players.length; i++) {
                    if (!players[i].done && !players[i].skipped) {
                        currentIndex = i;
                        break;
                    }
                }

                players.forEach(function(p, idx) {
                    const isCurrent = (idx === currentIndex);
                    const rowClass = isCurrent ? 'current' : '';

                    html += '<tr class="' + rowClass + '">';
                    html += '<td>' + (idx + 1) + (isCurrent ? ' ⬅️' : '') + '</td>';
                    html += '<td>' + (p.name || '—') + '</td>';
                    html += '<td class="done-' + (p.done ? 'true' : 'false') + '">' + (p.done ? '✅ Да' : '❌ Нет') + '</td>';
                    html += '<td class="skip-' + (p.skipped ? 'true' : 'false') + '">' + (p.skipped ? '⏭ Да' : '❌ Нет') + '</td>';
                    html += '<td>' + (p.diceUsed || 0) + '/' + (p.maxDice || 2) + '</td>';
                    html += '<td>' + (isCurrent ? '⏳ ТЕКУЩИЙ' : (p.done ? '✅ Отписался' : (p.skipped ? '⏭ Пропустил' : '⏳ Ожидание'))) + '</td>';
                    html += '</tr>';
                });

                html += '</table>';
            });

            playersTableEl.innerHTML = html;
            addLog('✅ Таблица отображена', 'ok');
        }

        // Автозагрузка
        setTimeout(loadData, 500);

        console.log('🔍 Тест запущен. Нажмите "Загрузить" для обновления.');
    </script>
</body>
</html>
