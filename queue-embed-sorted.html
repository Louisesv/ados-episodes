<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Очередь</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Century Gothic', 'CenturyGothic', 'Apple Gothic', sans-serif;
            font-size: 10px;
            color: #1a1a2e;
            background: transparent;
            padding: 0;
        }
        
        #queue-wrapper {
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 4px 0;
        }
        
        #queue-wrapper::-webkit-scrollbar {
            width: 4px;
        }
        #queue-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }
        #queue-wrapper::-webkit-scrollbar-thumb {
            background: #c0c0c0;
            border-radius: 10px;
        }
        #queue-wrapper::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }

        .queue-header {
            font-family: 'Century Gothic', 'CenturyGothic', 'Apple Gothic', sans-serif;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #333333;
            margin-bottom: 4px;
            padding-bottom: 4px;
            border-bottom: 1px solid #d0d0d0;
            flex-shrink: 0;
        }

        .queue-episode {
            font-family: 'Century Gothic', 'CenturyGothic', 'Apple Gothic', sans-serif;
            font-size: 10px;
            color: #1a1a2e;
            padding: 2px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
        }

        .queue-loading {
            font-family: 'Century Gothic', 'CenturyGothic', 'Apple Gothic', sans-serif;
            font-size: 10px;
            text-align: center;
            opacity: 0.6;
            padding: 8px 0;
            color: #6b7280;
        }

        .queue-error {
            font-family: 'Century Gothic', 'CenturyGothic', 'Apple Gothic', sans-serif;
            font-size: 10px;
            text-align: center;
            color: #dc2626;
            padding: 8px 0;
        }

        .queue-empty {
            font-family: 'Century Gothic', 'CenturyGothic', 'Apple Gothic', sans-serif;
            font-size: 10px;
            text-align: center;
            color: #6b7280;
            padding: 8px 0;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="queue-wrapper">
        <div id="queue-header" class="queue-header">Квестовая очередность:</div>
        <div id="queue-list">
            <div class="queue-loading">Загрузка...</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
    // ================================================================
    // КОНФИГ FIREBASE
    // ================================================================
    const FIREBASE_CONFIG = {
        apiKey: "AIzaSyAR3nEI0L71ux5Yro_XM76O1IYKkReXWnE",
        authDomain: "queue-tracker-ff855.firebaseapp.com",
        databaseURL: "https://queue-tracker-ff855-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "queue-tracker-ff855",
        storageBucket: "queue-tracker-ff855.firebasestorage.app",
        messagingSenderId: "545216354720",
        appId: "1:545216354720:web:f57c376b87e3924f232cc5",
        measurementId: "G-D3JQR37F9E"
    };
    // ================================================================

    var headerContainer = document.getElementById('queue-header');
    var listContainer = document.getElementById('queue-list');

    if (!firebase.apps.length) {
        firebase.initializeApp(FIREBASE_CONFIG);
    }
    var db = firebase.database();

    var ref = db.ref('queueDataAdvanced');

    ref.on('value', function(snapshot) {
        var data = snapshot.val();
        if (data && data.episodes) {
            render(data);
        } else {
            listContainer.innerHTML = '<div class="queue-error">⚠️ Нет данных</div>';
        }
    }, function(error) {
        listContainer.innerHTML = '<div class="queue-error">⚠️ Ошибка</div>';
    });

    // ================================================================
    // ФУНКЦИЯ ДЛЯ ФОРМАТИРОВАНИЯ НОМЕРА ЭПИЗОДА ИЗ КЛЮЧА
    // ================================================================
    function formatEpisodeNumberFromKey(key) {
        if (!key) return 'Ep.';
        // key имеет вид "ep1", "ep1.2", "ep2" и т.д.
        var num = key.replace('ep', '');
        return 'Ep. ' + num + ':';
    }

    // ================================================================
    // ФУНКЦИЯ ДЛЯ ИЗВЛЕЧЕНИЯ НОМЕРА ДЛЯ СОРТИРОВКИ
    // ================================================================
    function getEpisodeNumber(key) {
        if (!key) return 0;
        var num = parseFloat(key.replace('ep', ''));
        return isNaN(num) ? 0 : num;
    }

    // ================================================================
    // ФУНКЦИЯ ДЛЯ ОЧИСТКИ НАЗВАНИЯ
    // ================================================================
    function cleanTitle(title) {
        if (!title) return 'Без названия';
        // Убираем "Сталь, кровь и пепел: "
        var cleaned = title.replace(/^Сталь, кровь и пепел:\s*/, '');
        // Убираем "Ep.X.Y" или "Ep.X" из начала (если есть)
        cleaned = cleaned.replace(/^Ep\.\s*[\d.]+\s*/, '');
        // Убираем всё в скобках
        var index = cleaned.indexOf('(');
        if (index !== -1) {
            cleaned = cleaned.substring(0, index).trim();
        }
        return cleaned;
    }

    // ================================================================
    // ОТОБРАЖЕНИЕ
    // ================================================================
    function render(data) {
        var episodes = data.episodes || {};
        
        var episodeList = Object.keys(episodes).map(function(key) {
            return {
                key: key,
                data: episodes[key]
            };
        });

        // Сортируем по номеру из ключа
        episodeList.sort(function(a, b) {
            return getEpisodeNumber(a.key) - getEpisodeNumber(b.key);
        });

        if (episodeList.length === 0) {
            listContainer.innerHTML = '<div class="queue-empty">Нет эпизодов</div>';
            return;
        }

        var html = '';

        episodeList.forEach(function(item) {
            var ep = item.data;
            var key = item.key;
            if (!ep) return;

            var players = ep.players || [];
            var rawTitle = ep.title || 'Без названия';
            
            // ✅ Номер берём ИЗ КЛЮЧА
            var epNumber = formatEpisodeNumberFromKey(key);
            var title = cleanTitle(rawTitle);

            var current = null;
            for (var i = 0; i < players.length; i++) {
                if (!players[i].done && !players[i].skipped) {
                    current = players[i];
                    break;
                }
            }
            if (!current && players.length > 0) {
                current = players[0];
            }

            var name = current ? current.name : '—';
            
            // Дедлайн
            var deadline = current && current.deadline ? ' (до ' + current.deadline + ')' : '';

            var line = epNumber + ' ' + title + ' — ' + name + deadline;

            html += '<div class="queue-episode">' + line + '</div>';
        });

        listContainer.innerHTML = html;
    }
    </script>
</body>
</html>
