<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Очередь</title>
    <style>
        /* ================================================================
           ВСЕ СТИЛИ — ВНУТРИ IFRAME
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            overflow: hidden;           /* ← убираем прокрутку у body */
            font-family: 'Century Gothic', 'CenturyGothic', 'Apple Gothic', sans-serif;
            font-size: 10px;
            color: #1a1a2e;
            background: transparent;
            padding: 0;
        }
        
        /* Контейнер с прокруткой */
        #queue-wrapper {
            height: 100%;
            overflow-y: auto;           /* ← ВЕРТИКАЛЬНАЯ ПРОКРУТКА */
            overflow-x: hidden;         /* ← горизонтальная отключена */
            padding: 4px 0;
        }
        
        /* Стилизация скроллбара (опционально) */
        #queue-wrapper::-webkit-scrollbar {
            width: 4px;
        }
        #queue-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }
        #queue-wrapper::-webkit-scrollbar-thumb {
            background: #c0c0c0;
            border-radius: 10px;
        }
        #queue-wrapper::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }

        /* Заголовок */
        .queue-header {
            font-family: 'Century Gothic', 'CenturyGothic', 'Apple Gothic', sans-serif;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #333333;
            margin-bottom: 4px;
            padding-bottom: 4px;
            border-bottom: 1px solid #d0d0d0;
            flex-shrink: 0;             /* ← чтобы не сжимался */
        }

        /* Каждый эпизод — отдельный блок */
        .queue-episode {
            font-family: 'Century Gothic', 'CenturyGothic', 'Apple Gothic', sans-serif;
            font-size: 10px;
            color: #1a1a2e;
            padding: 2px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
        }

        /* Загрузка */
        .queue-loading {
            font-family: 'Century Gothic', 'CenturyGothic', 'Apple Gothic', sans-serif;
            font-size: 10px;
            text-align: center;
            opacity: 0.6;
            padding: 8px 0;
            color: #6b7280;
        }

        /* Ошибка */
        .queue-error {
            font-family: 'Century Gothic', 'CenturyGothic', 'Apple Gothic', sans-serif;
            font-size: 10px;
            text-align: center;
            color: #dc2626;
            padding: 8px 0;
        }

        /* Пусто */
        .queue-empty {
            font-family: 'Century Gothic', 'CenturyGothic', 'Apple Gothic', sans-serif;
            font-size: 10px;
            text-align: center;
            color: #6b7280;
            padding: 8px 0;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="queue-wrapper">
        <!-- БЛОК 1: ЗАГОЛОВОК -->
        <div id="queue-header" class="queue-header">Квестовая очередность:</div>
        
        <!-- БЛОК 2: СПИСОК ЭПИЗОДОВ -->
        <div id="queue-list">
            <div class="queue-loading">Загрузка...</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
    // ================================================================
    // КОНФИГ FIREBASE
    // ================================================================
    const FIREBASE_CONFIG = {
        apiKey: "AIzaSyAR3nEI0L71ux5Yro_XM76O1IYKkReXWnE",
        authDomain: "queue-tracker-ff855.firebaseapp.com",
        databaseURL: "https://queue-tracker-ff855-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "queue-tracker-ff855",
        storageBucket: "queue-tracker-ff855.firebasestorage.app",
        messagingSenderId: "545216354720",
        appId: "1:545216354720:web:f57c376b87e3924f232cc5",
        measurementId: "G-D3JQR37F9E"
    };
    // ================================================================

    var headerContainer = document.getElementById('queue-header');
    var listContainer = document.getElementById('queue-list');

    if (!firebase.apps.length) {
        firebase.initializeApp(FIREBASE_CONFIG);
    }
    var db = firebase.database();

    // ================================================================
    // ПУТЬ: queueDataAdvanced
    // ================================================================
    var ref = db.ref('queueDataAdvanced');

    ref.on('value', function(snapshot) {
        var data = snapshot.val();
        if (data && data.episodes) {
            render(data);
        } else {
            listContainer.innerHTML = '<div class="queue-error">⚠️ Нет данных</div>';
        }
    }, function(error) {
        listContainer.innerHTML = '<div class="queue-error">⚠️ Ошибка</div>';
    });

    // ================================================================
    // ФУНКЦИЯ ДЛЯ ИЗВЛЕЧЕНИЯ НОМЕРА ЭПИЗОДА ИЗ НАЗВАНИЯ
    // ================================================================
    function extractEpisodeNumber(title) {
        if (!title) return 0;
        var match = title.match(/^Ep\.([\d.]+)/);
        if (match) {
            var numStr = match[1];
            return parseFloat(numStr);
        }
        return 0;
    }

    // ================================================================
    // ФУНКЦИЯ ДЛЯ ОЧИСТКИ НАЗВАНИЯ
    // ================================================================
    function cleanTitle(title) {
        if (!title) return 'Без названия';
        var cleaned = title.replace(/^Сталь, кровь и пепел:\s*/, '');
        var index = cleaned.indexOf('(');
        if (index !== -1) {
            cleaned = cleaned.substring(0, index).trim();
        }
        return cleaned;
    }

    // ================================================================
    // ФУНКЦИЯ ДЛЯ ФОРМАТИРОВАНИЯ НОМЕРА ЭПИЗОДА
    // ================================================================
    function formatEpisodeNumber(title) {
        if (!title) return 'Ep.';
        var match = title.match(/^Ep\.([\d.]+)/);
        if (match) {
            var num = match[1];
            if (num.indexOf('.') !== -1) {
                return 'Ep. ' + num + ':';
            }
            return 'Ep. ' + num + ':';
        }
        return 'Ep.';
    }

    // ================================================================
    // ОТОБРАЖЕНИЕ
    // ================================================================
    function render(data) {
        var episodes = data.episodes || {};
        
        var episodeList = Object.keys(episodes).map(function(key) {
            return {
                key: key,
                data: episodes[key]
            };
        });

        episodeList.sort(function(a, b) {
            var numA = extractEpisodeNumber(a.data.title || '');
            var numB = extractEpisodeNumber(b.data.title || '');
            return numA - numB;
        });

        if (episodeList.length === 0) {
            listContainer.innerHTML = '<div class="queue-empty">Нет эпизодов</div>';
            return;
        }

        var html = '';

        episodeList.forEach(function(item) {
            var ep = item.data;
            if (!ep) return;

            var players = ep.players || [];
            var rawTitle = ep.title || 'Без названия';
            
            var epNumber = formatEpisodeNumber(rawTitle);
            var title = cleanTitle(rawTitle);

            var current = null;
            for (var i = 0; i < players.length; i++) {
                if (!players[i].done && !players[i].skipped) {
                    current = players[i];
                    break;
                }
            }
            if (!current && players.length > 0) {
                current = players[0];
            }

            var name = current ? current.name : '—';
            
            // Дедлайн
            var deadline = current && current.deadline ? ' (до ' + current.deadline + ')' : '';

            var line = epNumber + ' ' + title + ' — ' + name + deadline;

            html += '<div class="queue-episode">' + line + '</div>';
        });

        listContainer.innerHTML = html;
    }
    </script>
</body>
</html>
